<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fontLink -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- iconsLink -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
    <title>GitHub Issues Tracker</title>
  </head>
  <body class="bg-base-200">
   <main class="flex items-center justify-center min-h-screen bg-white w-full py-2 px-4">
      <div class="w-full max-w-md shadow-lg rounded-lg p-6">
        <div class="flex justify-center mb-4">
          <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-20 sm:w-24" />
        </div>
         <h2 class="text-center text-2xl font-semibold mb-6">GitHub Issues Tracker</h2>
        <div class=" space-y-4">
          <div class="grid space-y-3">
            <label for="username">Username</label>
            <input class="w-full p-3 rounded-lg border border-gray-300" type="text" id="username" />
            <p class="text-sm text-[#4A00FF]">Defaultt: admin</p>
            <label for="password">Password</label>
            <input
              class="w-full p-3 rounded-lg  border-gray-300" type="password" id="password"
            />
            <p class="text-sm text-[#4A00FF]">Defaultt: admin123</p>
          </div>
          <button id="sign_in" class="btn btn-primary w-full">Sign In</button>
          <div class="flex items-center gap-2 my-4">
            <hr class="flex-1 border-gray-300" />
            <span class="text-gray-500 font-semibold">OR</span>
            <hr class="flex-1 border-gray-300" />
          </div>
          <small class="flex justify-center mb-2">Demo Credentials:</small>
          <div class="bg-base-300 mb-10 ">
            <div class="flex justify-between">
              <p class="font-semibold">Username:</p>
              <p>admin</p>
            </div>
            <div class="flex justify-between mt-2">
              <p class="font-semibold">Password:</p>
              <p>admin123</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
