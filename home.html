<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fontLink -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- iconsLink -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>

    <title>home</title>
  </head>

  <body class="bg-base-200">
    <header>
      <div class="navbar bg-base-100 shadow-sm flex justify-between">
        <div class="flex items-center gap-2 mx-[80px]">
          <img src="./assets/github-logo.png" alt="" />
          <h2 class="font-semibold text-4xl">GitHub Issues Tracker</h2>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 border rounded-lg px-3 py-1">
            <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
            <input id="search_item"
              type="text"
              placeholder="Search issues..."
              class="border-none p-[2px] outline-none"
            />
          </div>

          <button id="submit_button" class="btn btn-primary">Search</button>
        </div>
      </div>
    </header>

    <section class="w-[80%] mx-auto mt-10 shadow-lg">
      <div class="bg-base-300 p-[20px]">
        <button id="all_btn" class="btn btn-primary">All</button>
        <button id="open_btn" onclick="openBtn()" class="btn btn-primary">
          Open
        </button>
        <button id="closed_btn" onclick="closedBtn()" class="btn btn-primary">
          Closed
        </button>
      </div>
    </section>

    <section class="w-[80%] mx-auto mt-[16px] shadow-lg">
      <div class="flex justify-between bg-white p-[20px]">
        <div class="flex items-center gap-2">
          <div
            class="w-[50px] h-[50px] rounded-full bg-[#ECE4FF] flex items-center justify-center"
          >
            <img src="./assets/Aperture.png" alt="" />
          </div>
          <div>
            <h2 id="total_cards" class="text-xl font-semibold"></h2>
            <p class="font-thin">Track and manage your project issues</p>
          </div>
        </div>

        <div class="flex gap-4">
          <div class="flex items-center text-center gap-1">
            <div class="w-[12px] h-[12px] rounded-full bg-[#00A96E]"></div>
            <p>Open</p>
          </div>
          <div class="flex items-center text-center gap-1">
            <div class="w-[12px] h-[12px] rounded-full bg-[#A855F7]"></div>
            <p>Closed</p>
          </div>
        </div>
      </div>
      <section
        id="card_container"
        class="bg-base-300 grid grid-cols-4 gap-4 p-[20px]"
      ></section>
      <!-- <div>

      </div> -->
    </section>

    <!-- Open the modal using ID.showModal() method -->
<!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
<dialog id="show_modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box space-y-4">
    <h3 id="show_modal_title" class="text-lg font-bold"></h3>
    <div class="flex gap-2">
      <div id="status_container" class=" rounded-full p-[4px] bg-[#00A96E] flex align-middle justify-center">
        <p id="show_modal_status" class="font-sm text-white text-sm"></p>
      </div>
       <div>
              <ul class=" flex list-disc list-inside gap-2">
                <li id="show_modal_author_name" class="text-sm">
                        
                </li>
                <li id="show_modal_created"  class="text-sm">
                      
                </li>
              </ul>
       </div>
       </div>
       
        <div id="show_modal_labels" class="flex flex-wrap gap-2">

        </div>
  
       <p id="show_modal_description" class="text-lg font-extralight"></p>

    <div class="flex justify-between">
      <div>
             <p>Assignee:</p>
             <h2 id="show_modal_author" class="font-bold text-lg"></h2>
      </div>
      <div>
            <p>Priority:</p>
            <div>
              <p id="show_modal_priority" class="rounded-full px-3 bg-red-600 font-light text-sm text-white p-1 flex text-center"></p>
            </div>
      </div>
    </div>
       
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn btn-primary">Close</button>
      </form>
    </div>
  </div>
</dialog>

    <script src="home.js"></script>
  </body>
</html>
